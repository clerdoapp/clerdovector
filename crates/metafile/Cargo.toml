[package]
name = "clerdovector-metafile"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "ClerdoVector Windows metafiles: hand-written EMF and WMF writers and readers"

[lints]
workspace = true

[dependencies]
clerdovector-geom = { workspace = true }
clerdovector-color = { workspace = true }
clerdovector-doc = { workspace = true }
clerdovector-effects = { workspace = true }
clerdovector-brush = { workspace = true }
clerdovector-text = { workspace = true }
kurbo = { workspace = true }
image = { workspace = true }

[dev-dependencies]
# The tests lay type out in the bundled fonts (the workspace leaves turning them on to the engine).
clerdovector-text = { workspace = true, features = ["bundled-fonts"] }
