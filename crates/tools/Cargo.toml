[package]
name = "clerdovector-tools"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "ClerdoVector tool state machines: pointer events in, commands and overlays out"

[lints]
workspace = true

[dependencies]
clerdovector-geom = { workspace = true }
clerdovector-color = { workspace = true }
clerdovector-doc = { workspace = true }
clerdovector-brush = { workspace = true }
clerdovector-pathops = { workspace = true }
clerdovector-effects = { workspace = true }
clerdovector-text = { workspace = true }
kurbo = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
image = { workspace = true }
# The tests lay type out in the bundled fonts (the workspace leaves turning them on to the engine).
clerdovector-text = { workspace = true, features = ["test-fonts", "bundled-fonts"] }
