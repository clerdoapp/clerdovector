[package]
name = "clerdovector-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "ClerdoVector engine: sessions, history, selection, the command registry"

[lints]
workspace = true

[features]
default = ["bundled-fonts"]
# The fonts clerdovector-text bundles (see its `bundled-fonts`). Embedders that supply every font at
# run time (`clerdovector_text::FontDb::add_font`) build with `default-features = false`.
bundled-fonts = ["clerdovector-text/bundled-fonts"]

[dependencies]
# Which paths stored in documents may be opened.
craft-docpath = { workspace = true }
clerdovector-geom = { workspace = true }
clerdovector-color = { workspace = true }
clerdovector-doc = { workspace = true }
clerdovector-tools = { workspace = true }
clerdovector-text = { workspace = true }
clerdovector-render = { workspace = true }
clerdovector-pathops = { workspace = true }
clerdovector-brush = { workspace = true }
clerdovector-trace = { workspace = true }
clerdovector-svg = { workspace = true }
clerdovector-format = { workspace = true }
clerdovector-pdf = { workspace = true }
clerdovector-cad = { workspace = true }
clerdovector-eps = { workspace = true }
clerdovector-metafile = { workspace = true }
clerdovector-plugins = { workspace = true }
clerdovector-affinity = { workspace = true }
clerdovector-scriptcheck = { workspace = true }
image = { workspace = true }
hayro-jpeg2000 = { version = "=0.4.1", default-features = false, features = ["std", "simd"] }
flate2 = { workspace = true }
# The XML parts of Word documents placed as type (place/docx.rs).
roxmltree = "0.21"
# The compound file that holds a Word 97-2003 document placed as type (place/doc.rs).
cfb = "0.15"
kurbo = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
log = { workspace = true }

# Whether a recovery area folder is this account's own (`FolderStore::own_area`). Already in
# Cargo.lock (tempfile, ui-egui), so this adds no new crate.
[target.'cfg(unix)'.dependencies]
rustix = { workspace = true, features = ["std", "process"] }

[dev-dependencies]
clerdovector-affinity = { workspace = true, features = ["synth"] }
crc32fast = { workspace = true }
clerdovector-testkit = { workspace = true }
proptest = { workspace = true }
# A variable font built in code (no font file is committed).
clerdovector-text = { workspace = true, features = ["test-fonts"] }
wat = { workspace = true }
# Zstandard streams for the Illustrator editing data fuzz tests.
ruzstd = { workspace = true }
